name: CI (Branch/Merge Group/PR)

on:
  push:
    branches-ignore:
      - root

  pull_request:
  merge_group:

jobs:
  build:
    strategy:
      matrix:
        env:
          - os: ubuntu-latest
            type: deb
            name: Linux (.deb)
            executable: "./gradlew"

          - os: ubuntu-latest
            type: rpm
            name: Linux (.rpm)
            executable: "./gradlew"

          - os: windows-latest
            type: exe
            name: Windows (.exe)
            executable: "gradlew.bat"

          - os: macos-13
            type: dmg
            name: Mac (Intel, .dmg)
            executable: "./gradlew"

          - os: macos-latest
            type: dmg
            name: Mac (Apple Silicon, .dmg)
            executable: "./gradlew"

    runs-on: ${{ matrix.env.os }}
    name: ${{ matrix.env.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4

        with:
          java-version: 21
          distribution: temurin

      - name: Gradle (Setup)
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle (Build)
        run: "${{ matrix.env.executable }} checkLicenses build package"

      - name: Upload artifact (Core JARs)
        uses: actions/upload-artifact@v4

        with:
          name: Distribution - ${{ matrix.env.name }}
          path: build/compose/binaries/main/${{ matrix.env.type }}/*.${{ matrix.env.type }}
