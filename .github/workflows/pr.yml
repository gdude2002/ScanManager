name: CI (Branch/Merge Group/PR)

on:
  push:
    branches-ignore:
      - root

  pull_request:
  merge_group:

jobs:
  build:
    strategy:
      matrix:
        env:
          - os: ubuntu-latest
            type: app
            name: Linux (AppImage)
            executable: "./gradlew"

          - os: ubuntu-latest
            type: deb
            name: Linux (.deb)
            executable: "./gradlew"

          - os: ubuntu-latest
            type: rpm
            name: Linux (.rpm)
            executable: "./gradlew"

          - os: macos-13
            type: dmg
            name: Mac (Intel, .dmg)
            executable: "./gradlew"

          - os: macos-13
            type: pkg
            name: Mac (Intel, .pkg)
            executable: "./gradlew"

          - os: macos-latest
            type: dmg
            name: Mac (Apple Silicon, .dmg)
            executable: "./gradlew"

          - os: macos-latest
            type: pkg
            name: Mac (Apple Silicon, .pkg)
            executable: "./gradlew"

          - os: windows-latest
            type: app
            name: Windows (Unpacked)
            executable: "./gradlew.bat"

          - os: windows-latest
            type: exe
            name: Windows (.exe)
            executable: "./gradlew.bat"

          - os: windows-latest
            type: msi
            name: Windows (.msi)
            executable: "./gradlew.bat"

    runs-on: ${{ matrix.env.os }}
    name: ${{ matrix.env.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4

        with:
          java-version: 21
          distribution: temurin

      - name: Gradle (Setup)
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle (Build)
        run: "${{ matrix.env.executable }} -DbuildType=${{ matrix.env.type }} checkLicenses build packageDistributionForCurrentOS"

      - name: List Distribution Files
        run: |
          ls -l build/compose/binaries/main/
          ls build/compose/binaries/main/*/

      - name: Upload artifact (Core JARs)
        uses: actions/upload-artifact@v4

        with:
          name: Distribution - ${{ matrix.env.name }}
          path: build/compose/binaries/main/${{ matrix.env.type }}/*.${{ matrix.env.type }}
